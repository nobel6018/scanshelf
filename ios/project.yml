# xcodegen generate 로 Scanshelf.xcodeproj를 만든다(생성물은 커밋하지 않음). docs/ios.md
name: Scanshelf
options:
  bundleIdPrefix: com.nobel6018
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.10"
    CURRENT_PROJECT_VERSION: "1"
    # AltStore가 설치할 때 무료 Apple ID로 다시 서명한다. 빌드 단계에서는 서명하지 않는다
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Scanshelf:
    type: application
    platform: iOS
    sources: [Scanshelf, Shared]
    dependencies:
      # 제어 센터 "스캔 시작" 버튼. 앱 안의 PlugIns/로 들어간다(docs/ios.md)
      - target: ScanshelfControls
    info:
      path: Scanshelf/Info.plist
      properties:
        CFBundleDisplayName: scanshelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 거치대에 올린 종이와 책을 촬영합니다.
        NSLocalNetworkUsageDescription: 같은 Wi-Fi에 있는 Mac으로 스캔을 보냅니다.
        NSBonjourServices: [_scanshelf._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobel6018.scanshelf
        # 원본은 design/logo-ios-1024.png. 둥근 모서리와 투명도 없는 1024 정사각형 한 장에서 시스템이 크기별로 만든다
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScanshelfControls:
    type: app-extension
    platform: iOS
    sources: [ScanshelfControls, Shared]
    info:
      path: ScanshelfControls/Info.plist
      properties:
        CFBundleDisplayName: scanshelf
        # 확장 버전은 앱과 같아야 설치된다. 프로젝트 설정의 MARKETING_VERSION을 같이 쓴다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nobel6018.scanshelf.controls
        # StartScanIntent의 앱 코드 호출은 앱에서만 컴파일한다
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SCANSHELF_CONTROLS
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  ScanshelfTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScanshelfTests]
    dependencies:
      - target: Scanshelf
