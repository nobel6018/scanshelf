[package]
name = "scanshelf"
version = "0.3.3"
description = "scanshelf Mac 앱: iPhone에서 받은 스캔을 보정, OCR, AI 정리, 내보내기"
edition = "2024"
publish = false

[lib]
name = "scanshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scanshelf-core = { path = "../crates/scanshelf-core" }
scanshelf-vision = { path = "../crates/scanshelf-vision" }
scanshelf-ai = { path = "../crates/scanshelf-ai" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# 검색 색인. trigram 토크나이저가 들어간 SQLite를 같이 빌드한다(docs/search.md)
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "2", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
eyre = "0.6.14"
ureq = "2.12"
tauri-plugin-process = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "fs", "io-util", "sync", "time", "macros"] }
keyring = "4"
getrandom = "0.3"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# 단축키, scanshelf:// 링크, 두 번째 실행 가로채기. 검증한 버전으로 고정한다(docs/shortcuts-and-deep-links.md)
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# 기본 기능 전체(NSLocale, NSString, NSArray 포함)
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-image-io = "0.3"
objc2-vision = "0.3"
objc2-pdf-kit = "0.3"
objc2-app-kit = "0.3"
# 캘린더 일정으로 묶음 추천(calendar.rs, docs/organize.md)
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKObject", "EKTypes", "EKError"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tempfile = "3"

# macOS는 시스템 mDNSResponder(DNSServiceRegister)로 Bonjour를 알리고, 다른 OS만 mdns-sd를 쓴다(transfer/bonjour.rs)
[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21"
